[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dnafx-preset"
version = "0.1.0"
description = "Standalone DNAfx preset switching library and CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "hidapi>=0.14",
    "python-rtmidi>=1.5.8",
    "pyusb>=1.3.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pyright>=1.1",
]

[project.scripts]
dnafx-preset = "dnafx_preset.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dnafx_preset = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"